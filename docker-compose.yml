services:
  frontend:
    build:
      context: ./ailfj-frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      # Bound to localhost only - in production, Caddy (below) is the only
      # thing that should be reachable from the internet; it reverse-proxies
      # to this container over the internal Docker network, not this port.
      # Locally this changes nothing: localhost:5173 still works exactly as
      # before, `127.0.0.1:5173` and `5173` are equivalent for local access.
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  celery-worker:
    build: ./backend
    # --concurrency fixed on purpose - without it Celery forks one worker
    # process per CPU core, and each fork holds its own DB connection pool
    # (see pool_size in db/session.py) against Supabase's shared, project-wide
    # 15-connection cap. Even --concurrency=2 with pool_size=2 still exceeded
    # it (2 forks x 2 engines x 4 conns = 16, before api's own share) - down
    # to 1 for now; revisit once on a paid Supabase tier with a higher cap.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  flower:
    build: ./backend
    command: celery -A app.worker.celery_app flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH}
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      # Bound to localhost only — never expose Flower directly to the internet
      # (it shows task args/results, which can include user data). Reach it via
      # SSH tunnel, or put a TLS reverse proxy in front if remote access is needed.
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      # Bound to localhost - Redis has no password configured, never expose
      # it beyond the machine it's running on. Containers still reach it via
      # the internal Docker network regardless of this host-port binding.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  redis_data:
  caddy_data:
  caddy_config: