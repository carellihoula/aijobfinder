server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's embedded DNS. With a bare `proxy_pass http://api:8000/`,
    # nginx resolves "api" once at startup and caches the IP forever — if the api
    # container is later recreated (new IP), nginx keeps hitting the dead one until
    # nginx itself restarts. Using a variable forces per-request resolution honoring
    # this short TTL, so a recreated api container is picked up automatically.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types has no .mjs entry, so ES modules (e.g. the
    # PDF.js worker) get served as application/octet-stream — Chrome then
    # refuses to execute them as a module script, breaking PDF rendering.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }

    location /api/ {
        # proxy_pass normally strips the "/api/" location prefix automatically when
        # its target ends in a URI — but that stripping is disabled as soon as the
        # target contains a variable (needed above for dynamic DNS re-resolution).
        # Strip the prefix ourselves instead.
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;

        # The cover-letter endpoints return the full generated content base64-encoded
        # in a response header (X-Cover-Letter-Content) alongside the PDF body — that
        # can exceed nginx's default 4k/8k header buffer for longer letters.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}